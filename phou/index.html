  if (e.target.closest("[data-notif]")) { notifFrom = screenName; closeViewer(); exitSelect(); screenName = "notif"; render(); return true; }
  if (screenName !== "notif") return false;
  if (e.target.closest("[data-nback]")) { screenName = notifFrom === "notif" ? "home" : notifFrom; render(); return true; }
  if (e.target.closest("[data-nreadall]")) { notifs.forEach(n => n.read = true); render(true); toast("알림을 모두 읽었어요"); return true; }
  const act = e.target.closest("[data-nact]");
  if (act) {
    const [kind, id] = act.dataset.nact.split(":");
    const n = notifs.find(x => x.id === Number(id));
    n.state = kind; n.read = true;
    if (n.type === "invite" && kind === "ok" && !folders.some(f => f.name === "한강 피크닉"))
      folders.unshift({ name: "한강 피크닉", date: "10.12", photos: 0, members: ["민", "승"], extra: 3, live: false, owner: false });
    render(true);
    toast(n.type === "approve" ? (kind === "ok" ? `${n.who}님을 승인했어요` : `${n.who}님의 참여를 거절했어요`)
                               : (kind === "ok" ? "'한강 피크닉'에 참여했어요" : "초대를 거절했어요"));
    return true;
  }
  const it = e.target.closest("[data-nid]");
  if (it) {
    const n = notifs.find(x => x.id === Number(it.dataset.nid));
    n.read = true;
    if (!n.go) { render(true); return true; }
    if (n.go === "trash") { render(true); toast("휴지통 화면은 아직 만들지 않았어요"); return true; }
    const idx = folders.findIndex(f => f.name === n.folder);
    if (idx < 0) { render(true); toast("삭제된 폴더예요"); return true; }
    if (n.go === "fset") { albumIdx = idx; states.fset = folders[idx].owner ? "owner" : "member"; screenName = "fset"; render(); return true; }
    states.album = "default";
    openAlbum(idx);
    if (n.go === "best") { albumTab = "best"; render(); }
    return true;
  }
  return false;
}

function createCta() {
  if (!cd) return "";
  const label = cd.step === 1 ? "다음" : cd.step === 2 ? "폴더 만들기" : "폴더로 가기";
  const ok = cd.step !== 1 || (cd.name.trim() && hoursBetween(cd.start, cd.end) > 0);
  return `<div class="c-cta" id="cCta"><button type="button" data-cnext id="cNext" ${ok ? "" : "disabled"}>${label}</button></div>`;
}

function refreshCreateBits() {
  const cnt = document.getElementById("cNameCount");
  if (cnt) cnt.textContent = `${cd.name.length}/20`;
  const btn = document.getElementById("cNext");
  if (btn && cd.step === 1) btn.disabled = !(cd.name.trim() && hoursBetween(cd.start, cd.end) > 0);
}

document.addEventListener("input", e => {
  const f = e.target.closest("[data-cfield]");
  if (!f || !cd) return;
  const k = f.dataset.cfield;
  cd[k] = f.value;
  if (k === "start" && cd.dur !== "custom") cd.end = addHours(cd.start, durList.find(d => d[0] === cd.dur)[2]);
  if (k === "start" || k === "end") {
    const err = document.getElementById("cWhenErr");
    if (err) err.hidden = hoursBetween(cd.start, cd.end) > 0;
  }
  refreshCreateBits();
});

function createClick(e) {
  if (screenName !== "create" || !cd) return false;
  if (e.target.closest("[data-cclose]")) {
    if (cd.step === 3 || !cd.name.trim()) { leaveCreate(); return true; }
    openSheet(`
      <h3>폴더 만들기를 그만둘까요?</h3>
      <p>지금까지 입력한 내용은 저장되지 않아요.</p>
      <div class="sheet-actions">
        <button class="btn btn-soft" type="button" data-sheetclose>계속 만들기</button>
        <button class="btn btn-primary" type="button" data-cquit>그만두기</button>
      </div>`);
    return true;
  }
  if (e.target.closest("[data-cquit]")) { closeSheet(); leaveCreate(); return true; }
  if (e.target.closest("[data-cprev]")) { cd.step = 1; cd.error = false; render(); return true; }
  const du = e.target.closest("[data-dur]");
  if (du) {
    cd.dur = du.dataset.dur;
    if (cd.dur !== "custom") cd.end = addHours(cd.start, durList.find(d => d[0] === cd.dur)[2]);
    render(true);
    return true;
  }
  const ct = e.target.closest("[data-ctoggle]");
  if (ct) { const k = ct.dataset.ctoggle; cd[k] = !cd[k]; ct.setAttribute("aria-checked", String(cd[k])); return true; }
  const cl = e.target.closest("[data-clink]");
  if (cl) { cd.link = cl.dataset.clink; render(true); return true; }
  const inv = e.target.closest("[data-invite]");
  if (inv) {
    const n = inv.dataset.invite;
    if (cd.invited.has(n)) return true;
    cd.invited.add(n); render(true); toast(`${n}님에게 초대 알림을 보냈어요`);
    return true;
  }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const url = cp.dataset.copy;
    const done = () => toast("링크를 복사했어요");
    try {
      navigator.clipboard.writeText(url).then(done, () => { selectUrl(); toast("링크를 길게 눌러 복사해 주세요"); });
    } catch (err) { selectUrl(); toast("링크를 길게 눌러 복사해 주세요"); }
    return true;
  }
  if (e.target.closest("[data-cnext]")) {
    if (cd.step === 1) { cd.step = 2; render(); return true; }
    if (cd.step === 2) {
      if (states.create === "fail") { cd.error = true; render(true); screen.scrollTo({ top: screen.scrollHeight, behavior: "smooth" }); return true; }
      folders.unshift({ name: cd.name.trim(), date: `${new Date(cd.start).getMonth() + 1}.${new Date(cd.start).getDate()}`, photos: cd.withToday ? 32 : 0, members: ["승"], extra: 0, live: true, isNew: true, owner: true });
      cd.newIdx = 0; cd.step = 3; cd.error = false;
      render();
      return true;
    }
    if (cd.step === 3) {
      const idx = cd.newIdx;
      const empty = folders[idx].photos === 0;
      cd = null;
      states.album = empty ? "empty" : "default";
      openAlbum(idx);
      return true;
    }
  }
  return false;
}
function selectUrl() {
  const el = document.getElementById("cUrl");
  if (!el) return;
  const r = document.createRange(); r.selectNodeContents(el);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
}
function leaveCreate() {
  cd = null;
  screenName = createFrom === "create" ? "home" : createFrom;
  render();
}

const fconfirms = {
  end:    { t: "지금 수집을 끝낼까요?", d: "이후에 찍은 사진은 이 폴더에 올라가지 않아요. 모든 참여자에게 알림이 가요.", ok: "수집 끝내기" },
  relink: { t: "링크를 새로 만들까요?", d: "지금 링크는 더 이상 열리지 않아요. 이미 참여한 사람은 그대로 볼 수 있어요.", ok: "새로 만들기" },
  delete: { t: "폴더를 삭제할까요?", d: "모든 참여자의 앨범에서 이 폴더와 사진이 사라져요. 되돌릴 수 없어요.", ok: "삭제" },
  leave:  { t: "폴더에서 나갈까요?", d: "이 폴더의 사진을 더 이상 볼 수 없어요. 내가 올린 사진은 폴더에 남아요.", ok: "나가기" },
};

/* ---------- 사진 상세 ---------- */
let viewer = null;   // { list, i, bare, info }
const shades = ["#3B3B3B", "#4A4A4A", "#303030", "#565656", "#424242", "#383838", "#4F4F4F"];
const people6 = ["승은", "지민", "민서", "서연", "하준", "유나"];
const photoGlyph = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>';
const fallbackReasons = ["모두 눈을 뜨고 있어요", "가장 선명해요", "표정이 가장 자연스러워요", "흔들림이 없어요", "모두 화면 안에 들어왔어요"];

function parseId(id) {
  const prefix = id[0];
  const [di, idx] = id.slice(1).split("-").map(Number);
  return { prefix, di, idx };
}

function groupOf(id) {
  const { prefix, di, idx } = parseId(id);
  if (prefix === "m") return null;
  if (prefix === "a" && states.album === "nogroup") return null;
  const d = (prefix === "p" ? days : albumDays)[di];
  for (const [i0s, size] of Object.entries(d.groups)) {
    const i0 = Number(i0s);
    if (idx < i0 || idx >= i0 + size) continue;
    const gid = `${prefix}${di}-${i0}`;
    const ks = leftKs(prefix, di, i0, size);
    if (ks.length < 2) return null;
    const pick = ks.includes(bestPick[gid] || 0) ? (bestPick[gid] || 0) : ks[0];
    const gi = Object.keys(d.groups).indexOf(i0s);
    const reason = (d.reasons && d.reasons[i0s]) || fallbackReasons[(di * 2 + gi) % fallbackReasons.length];
    return { gid, i0, ks, pick, k: idx - i0, reason, prefix, di };
  }
  return null;
}

function photoMeta(id) {
  const { prefix, di, idx } = parseId(id);
  const mine = ownedByMe(id);
  const who = mine ? "승은" : people6[1 + ((di + idx) % 5)];
  const h = 1 + ((idx * 5 + di) % 9), m = (idx * 7 + di * 13) % 60;
  const time = `오후 ${h}:${String(m).padStart(2, "0")}`;
  if (prefix === "p") {
    const d = days[di];
    return { title: d.folder, date: `${d.date} ${time}`, who, mine, place: d.folder === "속초 여행" ? "강원 속초시" : d.folder === "동아리 MT" ? "경기 가평군" : "서울 송파구" };
  }
  const d = albumDays[di];
  return { title: folders[albumIdx].name, date: `${d.head.replace(/ (오전|오후|저녁)$/, "")} ${time}`, who, mine, place: "강원 속초시" };
}

function openViewer(id) {
  const list = [...screen.querySelectorAll("[data-photo], [data-view]")].map(el => el.dataset.photo || el.dataset.view);
  let i = list.indexOf(id);
  if (i < 0) { list.unshift(id); i = 0; }
  viewer = { list: [...new Set(list)], i, bare: false, info: false };
  clearTimeout(toastTimer); document.getElementById("toast").classList.remove("show");
  document.getElementById("phone").classList.add("viewing");
  setThemeColor("#0B0B0B"); if (typeof ensureGuard === "function") ensureGuard();
  viewer.i = viewer.list.indexOf(id);
  renderViewer();
}

function closeViewer() {
  viewer = null;
  document.getElementById("phone").classList.remove("viewing");
  setThemeColor("#FFFFFF");
  document.getElementById("viewer").hidden = true;
}

function renderViewer() {
  const el = document.getElementById("viewer");
  if (!viewer) { el.hidden = true; return; }
  const id = viewer.list[viewer.i];
  const { idx, di } = parseId(id);
  const meta = photoMeta(id);
  const g = groupOf(id);
  const isBest = g && g.k === g.pick;
  const ico = {
    close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    save:  '<svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>',
    share: '<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
    info:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>',
    trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
  };
  el.hidden = false;
  el.classList.toggle("bare", viewer.bare);
  el.innerHTML = `
    <div class="v-top">
      <button class="icon-btn" type="button" data-vclose aria-label="닫기">${ico.close}</button>
      <div class="v-meta"><b>${meta.title}</b><small>${meta.date} · ${meta.mine ? "내가 올림" : `${meta.who}님이 올림`}</small></div>
      <span class="v-count">${viewer.i + 1} / ${viewer.list.length}</span>
    </div>
    <div class="v-stage" id="vStage">
      <div class="v-photo" style="background:${shades[(di * 3 + idx) % shades.length]}">${photoGlyph}</div>
      <button class="v-nav prev" type="button" data-vnav="-1" aria-label="이전 사진" ${viewer.i === 0 ? "disabled" : ""}>‹</button>
      <button class="v-nav next" type="button" data-vnav="1" aria-label="다음 사진" ${viewer.i === viewer.list.length - 1 ? "disabled" : ""}>›</button>
    </div>
    ${g ? `
    <div class="v-best">
      ${isBest ? `<span class="pill">BEST</span><p>${g.reason}</p>` : `<p style="color:#BDBDBD;font-weight:500">비슷한 사진 ${g.ks.length}장 중 하나예요</p><button class="set" type="button" data-vsetbest>이 컷을 BEST로</button>`}
    </div>
    <div class="v-strip" aria-label="같은 묶음 사진">
      ${g.ks.map(k => {
        const tid = `${g.prefix}${g.di}-${g.i0 + k}`;
        return `<button class="v-thumb" type="button" data-vthumb="${tid}" aria-current="${tid === id}" aria-label="묶음 ${k + 1}번째 사진" style="background:${shades[(g.di * 3 + g.i0 + k) % shades.length]}">${k === g.pick ? "<i>BEST</i>" : ""}</button>`;
      }).join("")}
    </div>` : ""}
    ${viewer.info ? `
    <div class="v-info">
      <dl>
        <dt>찍은 시간</dt><dd>${meta.date}</dd>
        <dt>올린 사람</dt><dd>${meta.mine ? "나 (승은)" : meta.who}</dd>
        <dt>장소</dt><dd>${meta.place}</dd>
        <dt>크기</dt><dd>4032 × 3024 · ${(4.2 + (idx % 5) * 0.3).toFixed(1)}MB</dd>
      </dl>
    </div>` : ""}
    <div class="v-actions">
      <button class="v-act" type="button" data-vsave>${ico.save}저장</button>
      <button class="v-act" type="button" data-msg="공유 화면은 아직 만들지 않았어요">${ico.share}공유</button>
      <button class="v-act" type="button" data-vinfo aria-pressed="${viewer.info}">${ico.info}정보</button>
      <button class="v-act${meta.mine ? "" : " locked"}" type="button" data-vdel>${ico.trash}삭제</button>
    </div>`;
}

function stepViewer(d) {
  if (!viewer) return;
  const n = viewer.i + d;
  if (n < 0 || n >= viewer.list.length) return;
  viewer.i = n; viewer.info = false;
  renderViewer();
}

// 사진을 좌우로 밀어 넘기기, 짧게 누르면 화면 정보 숨기기/보이기
let vDown = null;
document.addEventListener("pointerdown", e => {
  if (!viewer || !e.target.closest("#vStage") || e.target.closest(".v-nav")) return;
  vDown = { x: e.clientX, y: e.clientY };
});
// 손가락을 따라 사진이 움직이고, 넘기면 다음 사진이 옆에서 들어온다
document.addEventListener("pointermove", e => {
  if (!viewer || !vDown) return;
  const dx = e.clientX - vDown.x, dy = e.clientY - vDown.y;
  if (!vDown.drag && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) vDown.drag = true;
  if (!vDown.drag) return;
  const ph = document.querySelector("#vStage .v-photo");
  if (!ph) return;
  const edge = (dx > 0 && viewer.i === 0) || (dx < 0 && viewer.i === viewer.list.length - 1);
  ph.classList.add("dragging");
  ph.style.transform = `translateX(${edge ? dx * .3 : dx}px)`;
}, { passive: true });
document.addEventListener("pointercancel", () => {
  if (!vDown) return;
  vDown = null;
  const ph = document.querySelector("#vStage .v-photo");
  if (ph) { ph.classList.remove("dragging"); ph.style.transform = ""; }
});
document.addEventListener("pointerup", e => {
  if (!viewer || !vDown) return;
  const dx = e.clientX - vDown.x, dy = e.clientY - vDown.y;
  vDown = null;
  const ph = document.querySelector("#vStage .v-photo");
  if (ph) ph.classList.remove("dragging");
  const dir = dx < 0 ? 1 : -1;
  const can = viewer.i + dir >= 0 && viewer.i + dir < viewer.list.length;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) && can) {
    stepViewer(dir);
    const np = document.querySelector("#vStage .v-photo");
    if (np) {
      np.classList.add("dragging");
      np.style.transform = `translateX(${dir * 60}%)`;
      requestAnimationFrame(() => requestAnimationFrame(() => { np.classList.remove("dragging"); np.style.transform = ""; }));
    }
    return;
  }
  if (ph) ph.style.transform = "";
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) { viewer.bare = !viewer.bare; document.getElementById("viewer").classList.toggle("bare", viewer.bare); }
});
document.addEventListener("keydown", e => {
  if (!viewer) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowRight") stepViewer(1);
  if (e.key === "ArrowLeft") stepViewer(-1);
});

function viewerClick(e) {
  if (e.target.closest("[data-vclose]")) { closeViewer(); return true; }
  const nav = e.target.closest("[data-vnav]");
  if (nav) { stepViewer(Number(nav.dataset.vnav)); return true; }
  const th = e.target.closest("[data-vthumb]");
  if (th) {
    const id = th.dataset.vthumb;
    if (!viewer.list.includes(id)) viewer.list.splice(viewer.i + 1, 0, id);
    viewer.i = viewer.list.indexOf(id); viewer.info = false;
    renderViewer();
    return true;
  }
  if (e.target.closest("[data-vinfo]")) { viewer.info = !viewer.info; renderViewer(); return true; }
  if (e.target.closest("[data-vsave]")) { toast("원본으로 저장했어요"); return true; }
  if (e.target.closest("[data-vsetbest]")) {
    const id = viewer.list[viewer.i];
    const g = groupOf(id);
    bestPick[g.gid] = g.k;
    renderViewer(); render(true);
    toast("BEST 사진을 바꿨어요");
    return true;
  }
  if (e.target.closest("[data-vdel]")) {
    const id = viewer.list[viewer.i];
    if (!ownedByMe(id)) { toast("친구가 올린 사진은 올린 사람만 지울 수 있어요"); return true; }
    openSheet(`
      <h3>이 사진을 삭제할까요?</h3>
      <p>휴지통으로 옮겨지고, 30일 안에 되돌릴 수 있어요.</p>
      <div class="sheet-actions">
        <button class="btn btn-soft" type="button" data-sheetclose>취소</button>
        <button class="btn btn-primary" type="button" data-vdelgo>삭제</button>
      </div>`);
    return true;
  }
  return false;
}

/* ---------- 렌더 ---------- */
function renderSwitcher() {
  const cur = states[screenName];
  switcher.innerHTML = `<span>${screenTitles[screenName]} 상태</span>` +
    stateLabels[screenName].map(([k, l]) =>
      `<button type="button" data-state="${k}" aria-pressed="${k === cur}">${l}</button>`).join("") +
    `<button type="button" class="dev-close" data-devclose>닫기</button>`;
}


function render(keepScroll) {
  lastTop = keepScroll ? screen.scrollTop : 0;
  const top = screen.scrollTop;
  const views = { home: homeViews, photos: photoViews, album: albumViews, menu: menuViews, fset: fsetViews, create: createViews, notif: notifViews, profile: profileViews, pedit: peditViews, share: shareViews, cluster: clusterViews, review: reviewViews }[screenName];
  screen.innerHTML = views[states[screenName]]();
  screen.scrollTop = keepScroll ? top : 0;
  document.querySelectorAll(".tab[data-screen]").forEach(t => {
    if (t.dataset.screen === screenName) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  renderSwitcher();
  renderCal();
  renderAlbumChrome();
  ensureGuard();
}

// 아래로 스크롤하면 상단 영역을 숨기고, 위로 스크롤하면 다시 보여준다
let lastTop = 0;
let holdBarUntil = 0;   // 날짜 이동처럼 코드가 스크롤할 때는 상단 영역을 유지
screen.addEventListener("scroll", () => {
  const st = screen.querySelector(".sticky");
  const y = screen.scrollTop;
  if (st) {
    st.classList.toggle("scrolled", y > 4);
    const dy = y - lastTop;
    if (Date.now() < holdBarUntil || y < st.offsetHeight) st.classList.remove("hide");
    else if (dy > 6) st.classList.add("hide");
    else if (dy < -6) st.classList.remove("hide");
    // 공유 앨범: 본문의 다운로드 버튼이 지나가면 상단 바 아래에 다운로드 버튼을 붙인다
    const inflow = screen.querySelector(".dl-inflow");
    if (inflow) st.classList.toggle("past", y > inflow.offsetTop - screen.offsetTop + inflow.offsetHeight - st.offsetHeight);
  }
  if (Math.abs(y - lastTop) > 6 || y < 4) lastTop = y;
}, { passive: true });

function renderCal() {
  const show = calOpen && screenName === "photos" && states.photos === "default";
  document.getElementById("calLayer").hidden = !show;
  document.getElementById("calPop").innerHTML = show ? calendar() : "";
}

function closeCal() { calOpen = false; }

let toastTimer;
const BEST_HINT = "사진을 길게 누르면 BEST컷으로 변경돼요";
function toast(msg, ms = 1800) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

document.addEventListener("click", e => {
  if (longPressed || Date.now() < suppressClickUntil) { longPressed = false; return; }
  if (e.target.closest("[data-vdelgo]")) {
    const id = viewer.list[viewer.i];
    deleted.add(id); trashCount++;
    viewer.list.splice(viewer.i, 1);
    closeSheet();
    render(true);
    if (!viewer.list.length) closeViewer();
    else { viewer.i = Math.min(viewer.i, viewer.list.length - 1); renderViewer(); }
    toast("휴지통으로 옮겼어요");
    return;
  }
  if (viewer && e.target.closest("#viewer")) {
    if (viewerClick(e)) return;
    const vm = e.target.closest("[data-msg]");
    if (vm) toast(vm.dataset.msg);
    return;
  }
  const vw = e.target.closest("[data-view]");
  if (vw && !selecting) { openViewer(vw.dataset.view); return; }
  const sw = e.target.closest("#switcher button");
  if (sw) {
    const s = sw.dataset.state;
    if (screenName === "home" && s === "default") suggestOpen = true;
    if (screenName === "photos" && s !== "default") closeCal();
    exitSelect();
    closeViewer();
    if (screenName === "album") { openGroup = null; stopDl(); closeSheet(); if (s === "nogroup" && albumTab === "best") albumTab = "all"; }
    states[screenName] = s;
    render();
    return;
  }
  const tab = e.target.closest(".tab[data-screen]");
  if (tab) {
    if (tab.dataset.screen === "menu" && menuSub) { menuSub = null; screenName = "menu"; render(); return; }
    if (tab.dataset.screen !== screenName) { screenName = tab.dataset.screen; closeCal(); exitSelect(); render(); }
    return;
  }
  if (e.target.closest("[data-close]")) { suggestOpen = false; render(true); return; }

  // 옵션 · 선택 모드 · 비슷한 사진 삭제
  const op = e.target.closest("[data-opts]");
  if (op) { openSheet(optionsSheet(op.dataset.opts)); return; }
  const opt = e.target.closest("[data-opt]");
  if (opt) {
    const k = opt.dataset.opt;
    closeSheet();
    if (k === "select") {
      selecting = true; selected.clear(); expanded.clear(); openGroup = null;
      if (screenName === "photos" && chip !== "all" && chip !== "best") chip = "all";
      if (screenName === "album" && albumTab === "best") albumTab = "all";
      render(true);
      return;
    }
    if (k === "fset") { stopDl(); states.fset = folders[albumIdx].owner ? "owner" : "member"; screenName = "fset"; render(); return; }
    if (k === "delfolder" || k === "leavefolder") {
      const c = fconfirms[k === "delfolder" ? "delete" : "leave"];
      openSheet(`
        <h3>${c.t}</h3>
        <p>${c.d}</p>
        <div class="sheet-actions">
          <button class="btn btn-soft" type="button" data-sheetclose>취소</button>
          <button class="btn btn-primary" type="button" data-fdo="${k === "delfolder" ? "delete" : "leave"}">${c.ok}</button>
        </div>`);
      return;
    }
    if (k === "dedupe") {
      const prefix = screenName === "photos" ? "p" : "a";
      const grouped = !(screenName === "album" && states.album === "nogroup");
      const { mine, others } = grouped ? dedupeCandidates(prefix) : { mine: [], others: [] };
      if (!mine.length) { toast(others.length ? "내가 올린 비슷한 사진이 없어요" : "정리할 비슷한 사진이 없어요"); return; }
      openSheet(`
        <h3>비슷한 사진 ${mine.length}장을 삭제할까요?</h3>
        <p>묶음마다 BEST컷 1장만 남기고 나머지를 휴지통으로 옮겨요. 30일 안에 되돌릴 수 있어요.${others.length ? `<br>친구가 올린 ${others.length}장은 올린 사람만 지울 수 있어서 남겨 둬요.` : ""}</p>
        <div class="sheet-actions">
          <button class="btn btn-soft" type="button" data-sheetclose>취소</button>
          <button class="btn btn-primary" type="button" data-dedupego="${prefix}">${mine.length}장 삭제</button>
        </div>`);
      return;
    }
  }
  const dg = e.target.closest("[data-dedupego]");
  if (dg) {
    const { mine } = dedupeCandidates(dg.dataset.dedupego);
    mine.forEach(id => deleted.add(id));
    trashCount += mine.length;
    expanded.clear(); openGroup = null;
    closeSheet();
    render(true);
    toast(`${mine.length}장을 휴지통으로 옮겼어요`);
    return;
  }
  if (e.target.closest("[data-selcancel]")) { exitSelect(); render(true); return; }
  if (e.target.closest("[data-selsave]")) {
    const n = selected.size;
    exitSelect(); render(true);
    toast(`${n}장을 원본으로 저장했어요`);
    return;
  }
  if (selecting && e.target.closest("[data-selall]")) {
    const ids = [...screen.querySelectorAll("[data-photo]")].map(el => el.dataset.photo);
    const allOn = ids.every(id => selected.has(id));
    ids.forEach(id => allOn ? selected.delete(id) : selected.add(id));
    screen.querySelectorAll("[data-photo]").forEach(el => el.setAttribute("aria-pressed", String(selected.has(el.dataset.photo))));
    updateSelbar();
    return;
  }
  if (selecting && e.target.closest("[data-seldel]")) {
    if (!selected.size) { toast("삭제할 사진을 골라 주세요"); return; }
    const ids = [...selected];
    const mineIds = ids.filter(ownedByMe), others = ids.length - mineIds.length;
    if (!mineIds.length) { toast("친구가 올린 사진은 올린 사람만 지울 수 있어요"); return; }
    openSheet(`
      <h3>사진 ${mineIds.length}장을 삭제할까요?</h3>
      <p>휴지통으로 옮겨지고, 30일 안에 되돌릴 수 있어요.${others ? `<br>고른 사진 중 친구가 올린 ${others}장은 올린 사람만 지울 수 있어서 남겨 둬요.` : ""}</p>
      <div class="sheet-actions">
        <button class="btn btn-soft" type="button" data-sheetclose>취소</button>
        <button class="btn btn-primary" type="button" data-seldelgo>${mineIds.length}장 삭제</button>
      </div>`);
    return;
  }
  if (e.target.closest("[data-seldelgo]")) {
    const mineIds = [...selected].filter(ownedByMe);
    mineIds.forEach(id => deleted.add(id));
    trashCount += mineIds.length;
    exitSelect(); closeSheet(); render(true);
    toast(`${mineIds.length}장을 휴지통으로 옮겼어요`);
    return;
  }
  if (selecting) {
    const ph = e.target.closest("[data-photo]");
    if (ph) {
      const id = ph.dataset.photo;
      selected.has(id) ? selected.delete(id) : selected.add(id);
      ph.setAttribute("aria-pressed", String(selected.has(id)));
      updateSelbar();
      return;
    }
  }

  // 프로필
  if (profileClick(e)) return;

  // 알림
  if (notifClick(e)) return;

  // 폴더 만들기
  if (createClick(e)) return;
  const cr = e.target.closest("[data-create]");
  if (cr) { openCreate(cr.dataset.create || ""); return; }
  if (e.target.closest("#fab") && screenName !== "album" && !selecting) { openCreate(""); return; }

  // 폴더 설정
  if (e.target.closest("[data-fset]")) { stopDl(); states.fset = folders[albumIdx].owner ? "owner" : "member"; screenName = "fset"; render(); return; }
  if (e.target.closest("[data-fback]")) { closeSheet(); screenName = "album"; render(); return; }
  const ft = e.target.closest("[data-ftoggle]");
  if (ft) { const k = ft.dataset.ftoggle; fset[k] = !fset[k]; render(true); return; }
  const lk = e.target.closest("[data-link]");
  if (lk) { fset.link = lk.dataset.link; render(true); return; }
  if (e.target.closest("[data-extend]")) {
    if (fset.extend >= 6) { toast("최대 6시간까지 연장할 수 있어요"); return; }
    fset.extend++; render(true); toast("수집 시간을 1시간 연장했어요"); return;
  }
  const fc = e.target.closest("[data-fconfirm]");
  if (fc) {
    const c = fconfirms[fc.dataset.fconfirm];
    openSheet(`
      <h3>${c.t}</h3>
      <p>${c.d}</p>
      <div class="sheet-actions">
        <button class="btn btn-soft" type="button" data-sheetclose>취소</button>
        <button class="btn btn-primary" type="button" data-fdo="${fc.dataset.fconfirm}">${c.ok}</button>
      </div>`);
    return;
  }
  const fd = e.target.closest("[data-fdo]");
  if (fd) {
    closeSheet();
    const k = fd.dataset.fdo;
    if (k === "end") { folders[albumIdx].live = false; render(true); toast("수집을 끝냈어요"); }
    if (k === "relink") toast("새 링크를 만들었어요");
    if (k === "delete" || k === "leave") {
      const name = folders[albumIdx].name;
      stopDl();
      folders.splice(albumIdx, 1);
      albumIdx = 0;
      screenName = "home";
      render();
      toast(k === "delete" ? `'${name}' 폴더를 삭제했어요` : `'${name}' 폴더에서 나갔어요`);
    }
    return;
  }

  // 메뉴
  const ms = e.target.closest("[data-msub]");
  if (ms) { menuSub = ms.dataset.msub; render(); return; }
  if (e.target.closest("[data-mback]")) { fEdit = false; fSel.clear(); menuSub = menuSub && menuSub.startsWith("friend:") ? "friends" : null; render(); return; }
  const fh = e.target.closest("[data-fhide]");
  if (fh) { hiddenFriends.add(fh.dataset.fhide); menuSub = "friends"; render(); toast(`${fh.dataset.fhide}님을 숨겼어요`); return; }
  if (e.target.closest("[data-funhide]")) { hiddenFriends.clear(); render(true); toast("숨긴 사람을 다시 보이게 했어요"); return; }
  const fi = e.target.closest("[data-finvite]");
  if (fi) { openInviteSheet([fi.dataset.finvite]); return; }
  const into = e.target.closest("[data-finto]");
  if (into) {
    const f = folders[Number(into.dataset.finto)];
    const newOnes = inviteNames.filter(n => !friends.find(x => x.n === n).folders.includes(f.name));
    newOnes.forEach(n => friends.find(x => x.n === n).folders.push(f.name));
    closeSheet(); fEdit = false; fSel.clear(); render(true);
    toast(`${newOnes.length > 2 ? `${newOnes[0]}님 외 ${newOnes.length - 1}명` : newOnes.map(n => `${n}님`).join(", ")}을 '${f.name}'에 초대했어요`);
    return;
  }
  if (e.target.closest("[data-finnew]")) { closeSheet(); fEdit = false; fSel.clear(); inviteToNew(inviteNames); return; }
  // 친구 편집 모드
  const fp = e.target.closest("[data-fpick]");
  if (fp) {
    const n = fp.dataset.fpick;
    fSel.has(n) ? fSel.delete(n) : fSel.add(n);
    render(true);
    return;
  }
  if (e.target.closest("[data-fall]")) {
    const all = visibleFriends().every(f => fSel.has(f.n));
    visibleFriends().forEach(f => all ? fSel.delete(f.n) : fSel.add(f.n));
    render(true);
    return;
  }
  if (e.target.closest("[data-fcancel]")) { fEdit = false; fSel.clear(); render(true); return; }
  if (e.target.closest("[data-fhidesel]")) {
    const n = fSel.size;
    fSel.forEach(x => hiddenFriends.add(x));
    fEdit = false; fSel.clear(); render(true);
    toast(`${n}명을 숨겼어요`);
    return;
  }
  if (e.target.closest("[data-finvsel]")) {
    openInviteSheet([...fSel]);
    return;
  }
  const tg = e.target.closest("[data-toggle]");
  if (tg) {
    const k = tg.dataset.toggle;
    settings[k] = !settings[k];
    tg.setAttribute("aria-checked", String(settings[k]));
    return;
  }

  // 공유 앨범
  const alb = e.target.closest("[data-album]");
  if (alb) { openAlbum(Number(alb.dataset.album)); return; }
  if (e.target.closest("[data-back]")) { stopDl(); closeSheet(); exitSelect(); screenName = albumFrom; render(true); return; }
  const at = e.target.closest("[data-atab]");
  if (at) { albumTab = at.dataset.atab; openGroup = null; if (albumTab === "best") exitSelect(); render(true); return; }
  if (e.target.closest("[data-dl]")) {
    if (dl.running) return;
    const n = folders[albumIdx].photos;
    openSheet(`
      <h3>${n}장 · ${sizeOf(n)}를 원본 화질로 저장할까요?</h3>
      <p>휴대폰 사진 앱에 저장돼요. 내가 찍은 사진은 이미 있어서 건너뛰어요.</p>
      <div class="sheet-actions">
        <button class="btn btn-soft" type="button" data-sheetclose>취소</button>
        <button class="btn btn-primary" type="button" data-dlgo>저장</button>
      </div>`);
    return;
  }
  if (e.target.closest("[data-dlgo]")) { closeSheet(); startDl(); return; }
  const au = e.target.closest("[data-autoup]");
  if (au) {
    const idx = Number(au.dataset.autoup);
    closeSheet();
    states.album = "default";
    openAlbum(idx);
    startAutoUpload(idx);
    render(true);
    return;
  }
  if (e.target.closest("[data-sheetclose]")) { closeSheet(); return; }
  const sb = e.target.closest("[data-setbest]");
  if (sb) {
    const [gid, k] = sb.dataset.setbest.split(":");
    bestPick[gid] = Number(k);
    closeSheet();
    render(true);
    toast("BEST 사진을 바꿨어요");
    return;
  }
  if (e.target.closest("[data-aisave]")) { toast(`추천 사진 ${groupCount}장을 원본으로 저장했어요`); return; }
  const ag = e.target.closest("[data-agroup]");
  if (ag && openGroup !== ag.dataset.agroup) { openGroup = ag.dataset.agroup; render(true); toast(BEST_HINT, 3500); return; }
  // 펼친 묶음의 BEST 사진을 한 번 더 누르면 접기
  if (ag && openGroup === ag.dataset.agroup) { openGroup = null; render(true); return; }
  if (e.target.closest("[data-retry]")) {
    const which = screenName;
    states[which] = "loading"; render();
    setTimeout(() => { if (states[which] === "loading") { states[which] = "default"; if (screenName === which) render(); } }, 1200);
    return;
  }
  if (e.target.closest("[data-reset]")) { chip = "all"; pickedDate = null; states.photos = "default"; render(); return; }
  if (e.target.closest("[data-cal]")) { calOpen = !calOpen; render(true); return; }
  if (e.target.closest("[data-calclose]")) { calOpen = false; renderCal(); render(true); return; }
  const mo = e.target.closest("[data-month]");
  if (mo) {
    calM += Number(mo.dataset.month);
    if (calM < 0) { calM = 11; calY--; } else if (calM > 11) { calM = 0; calY++; }
    render(true);
    return;
  }
  const dayBtn = e.target.closest("[data-day]");
  if (dayBtn) {
    const iso = dayBtn.dataset.day;
    if (!days.some(d => d.iso === iso)) { toast(`${labelOf(iso)}에 찍은 사진이 없어요`); return; }
    pickedDate = iso;
    calOpen = false;
    if (chip !== "all" && chip !== "best") chip = "all";
    render();
    const target = document.getElementById(`day-${iso}`);
    const bar = screen.querySelector(".sticky");
    holdBarUntil = Date.now() + 900;
    if (target) screen.scrollTo({ top: target.offsetTop - screen.offsetTop - (bar ? bar.offsetHeight : 0) - 8, behavior: "smooth" });
    return;
  }
  const c = e.target.closest("[data-chip]");
  if (c) {
    chip = c.dataset.chip;
    if (chip !== "all" && chip !== "best") exitSelect();
    render(true);
    return;
  }
  // 묶음 BEST 사진: 첫 클릭은 묶음 펼치기(한 번에 한 묶음만), 펼친 뒤 다시 클릭하면 접기
  const grp = e.target.closest("[data-group]");
  if (grp && !expanded.has(grp.dataset.group)) {
    expanded.clear();
    expanded.add(grp.dataset.group);
    render(true);
    toast(BEST_HINT, 3500);
    return;
  }
  // 펼친 묶음의 BEST 사진을 한 번 더 누르면 접기
  if (grp && expanded.has(grp.dataset.group)) { expanded.delete(grp.dataset.group); render(true); return; }
  const p = e.target.closest("[data-photo]");
  if (p) {
    openViewer(p.dataset.photo);
    return;
  }
  const m = e.target.closest("[data-msg]");
  if (m && !m.disabled) toast(m.dataset.msg);
});

/* ---------- 휴대폰 동작 ---------- */
const isPhone = () => matchMedia("(max-width: 600px)").matches;
function setThemeColor(c) { const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = c; }

// 확대 막기 (iOS 핀치·더블탭)
document.addEventListener("gesturestart", e => e.preventDefault());

// 상태 전환 패널: 휴대폰에서는 두 손가락으로 탭해서 열고 닫는다. 주소에 ?dev 를 붙이면 열린 채로 시작
if (/[?&]dev\b/.test(location.search)) document.body.classList.add("dev-open");
document.addEventListener("touchstart", e => {
  if (e.touches.length === 2) { e.preventDefault(); document.body.classList.toggle("dev-open"); }
}, { passive: false });
document.addEventListener("click", e => {
  if (e.target.closest("[data-devclose]")) { e.stopPropagation(); document.body.classList.remove("dev-open"); return; }
  // 지금 탭을 한 번 더 누르면 맨 위로
  const tab = e.target.closest(".tab[data-screen]");
  if (tab && tab.dataset.screen === screenName && !(screenName === "menu" && menuSub)) screen.scrollTo({ top: 0, behavior: "smooth" });
}, true);

// 길게 누르는 중에 손가락이 움직이면(스크롤) 길게 누르기를 취소
let pressStart = null;
document.addEventListener("pointerdown", e => { pressStart = { x: e.clientX, y: e.clientY }; }, true);
document.addEventListener("pointermove", e => {
  if (!pressStart || !pressTimer) return;
  if (Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 10) { clearTimeout(pressTimer); pressTimer = null; }
}, { passive: true });

// 바텀 시트를 아래로 밀어서 닫기
const sheetEl = document.getElementById("sheetBody");
let sDrag = null;
sheetEl.addEventListener("pointerdown", e => {
  if (e.target.closest("input, textarea") || sheetEl.scrollTop > 0) return;
  sDrag = { x: e.clientX, y: e.clientY, dy: 0, on: false, t: Date.now() };
});
document.addEventListener("pointermove", e => {
  if (!sDrag) return;
  const dx = e.clientX - sDrag.x, dy = e.clientY - sDrag.y;
  if (!sDrag.on) {
    if (dy > 8 && dy > Math.abs(dx)) { sDrag.on = true; sDrag.t = Date.now(); sheetEl.classList.add("dragging"); }
    else if (Math.abs(dx) > 8 || dy < -8) { sDrag = null; return; }
    else return;
  }
  sDrag.dy = Math.max(0, dy - 8);
  sheetEl.style.transform = `translateY(${sDrag.dy}px)`;
}, { passive: true });
["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, () => {
  if (!sDrag) return;
  const d = sDrag; sDrag = null;
  if (!d.on) return;
  sheetEl.classList.remove("dragging");
  suppressClickUntil = Date.now() + 300;
  if (d.dy > 90 || d.dy / Math.max(1, Date.now() - d.t) > .6) closeSheet();
  else sheetEl.style.transform = "";
}));

// 휴대폰 뒤로 가기(안드로이드 뒤로 버튼, iOS 가장자리 스와이프)를 앱 안의 뒤로 가기로 바꾼다
let guarded = false;
const atRoot = () => screenName === "home" && !viewer && document.getElementById("sheet").hidden && !calOpen && !selecting && !document.body.classList.contains("dev-open");
function ensureGuard() {
  if (guarded || atRoot()) return;
  history.pushState({ phou: 1 }, "");
  guarded = true;
}
function goBack() {
  const sheet = document.getElementById("sheet");
  if (!sheet.hidden && !sheet.classList.contains("closing")) { closeSheet(); return; }
  if (document.body.classList.contains("dev-open")) { document.body.classList.remove("dev-open"); return; }
  if (viewer) { closeViewer(); return; }
  if (calOpen) { calOpen = false; render(true); return; }
  if (selecting) { exitSelect(); render(true); return; }
  const backs = ["[data-qrclose]", "[data-fcancel]", "[data-back]", "[data-mback]", "[data-fback]", "[data-nback]", "[data-pback]",
                 "[data-peback]", "[data-shback]", "[data-clback]", "[data-rvclose]", "[data-cprev]", "[data-cclose]"];
  for (const s of backs) { const b = screen.querySelector(s); if (b) { b.click(); return; } }
  if (screenName !== "home") { screenName = "home"; closeCal(); exitSelect(); render(); }
}
window.addEventListener("popstate", () => {
  guarded = false;
  goBack();
  ensureGuard();
});

// 키보드가 올라오면 화면 높이를 맞추고 입력칸이 가려지지 않게
if (window.visualViewport) {
  const vv = window.visualViewport, phoneEl = document.getElementById("phone");
  let lastH = vv.height;
  const fit = () => {
    if (!isPhone()) { phoneEl.style.height = ""; phoneEl.style.top = ""; return; }
    phoneEl.style.height = `${vv.height}px`;
    phoneEl.style.top = `${vv.offsetTop}px`;
    const a = document.activeElement;
    if (vv.height < lastH - 80 && a && a.matches("input, textarea")) setTimeout(() => a.scrollIntoView({ block: "center", behavior: "smooth" }), 60);
    lastH = vv.height;
  };
  vv.addEventListener("resize", fit);
  vv.addEventListener("scroll", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 300));
  fit();
}

// 스크롤 표시: 스크롤하는 동안만 짧고 가는 막대를 보여주고, 멈추면 잠시 뒤 사라진다
const satProbe = Object.assign(document.createElement("div"), { className: "sat-probe" });
document.getElementById("phone").appendChild(satProbe);
function scrollIndicator(scroller, host, topInset = () => 0) {
  const bar = Object.assign(document.createElement("div"), { className: "sb-ind" });
  bar.setAttribute("aria-hidden", "true");
  host.appendChild(bar);
  let timer;
  scroller.addEventListener("scroll", () => {
    const max = scroller.scrollHeight - scroller.clientHeight;
    if (max <= 2) return;
    const hr = host.getBoundingClientRect(), sr = scroller.getBoundingClientRect();
    const inset = topInset();
    const track = sr.height - inset - 12;
    const h = Math.max(40, Math.min(56, track * scroller.clientHeight / scroller.scrollHeight));
    bar.style.height = `${h}px`;
    bar.style.top = `${sr.top - hr.top + inset + 6 + (track - h) * Math.min(1, Math.max(0, scroller.scrollTop / max))}px`;
    bar.style.right = `${hr.right - sr.right + 4}px`;
    bar.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(() => bar.classList.remove("on"), 900);
  }, { passive: true });
}
scrollIndicator(screen, document.getElementById("phone"), () => satProbe.offsetHeight);
scrollIndicator(document.getElementById("sheetBody"), document.getElementById("sheet"));

render();
setTimeout(showLaunchUpload, 450);
</script>
