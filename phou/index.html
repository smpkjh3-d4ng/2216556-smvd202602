<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="서비스명">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>사진 공유 앱 홈 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 375px 폰 프레임 하나, 위에 상태 전환 바. 앱은 무채색(흰색~검정)만, 브랜드 색 미정. 하단 탭으로 홈 ↔ 전체 사진 */
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --page: #EEEEEE;
  --fg: #111111;
  --sub: #707070;
  --line: #E4E4E4;
  --ph: #E2E2E2;
  --ph-2: #CFCFCF;
  --accent: #1A1A1A;
  --accent-soft: #F2F2F2;
  --danger: #333333;
  --danger-soft: #EAEAEA;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--page);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  word-break: keep-all;
  padding-inline: 16px;
  padding-block: 20px 32px;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 상태 전환 바 (프로토타입 확인용) */
.switcher {
  max-width: 375px; margin: 0 auto 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
}
.switcher span { font-size: 12px; color: var(--sub); margin-right: 4px; letter-spacing: .02em; }
.switcher button {
  font-size: 12px; padding: 6px 12px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--line); color: var(--sub);
}
.switcher button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: #fff; }

/* 폰 프레임 */
.phone {
  max-width: 375px; margin: 0 auto;
  height: min(780px, calc(100vh - 90px)); min-height: 560px;
  background: var(--bg);
  border-radius: 28px; border: 1px solid var(--line);
  box-shadow: 0 12px 40px rgba(0,0,0,.08);
  display: flex; flex-direction: column; overflow: hidden; position: relative;
}
.scroll { flex: 1; overflow-y: auto; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 20px; }
.scroll > * { flex-shrink: 0; }
[hidden] { display: none !important; }

/* 상단 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { width: 72px; height: 22px; border: 1.5px dashed var(--ph-2); border-radius: 4px; background: var(--accent-soft); display: grid; place-items: center; font-size: 10px; color: var(--sub); letter-spacing: .02em; }
.greet { margin: -8px 0 0; font-size: 21px; line-height: 1.35; font-weight: 700; text-wrap: balance; }
.top-icons { display: flex; align-items: center; gap: 6px; padding-top: 2px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--bg); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--ph-2); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--fg); }

/* 핵심 버튼 */
.create {
  width: 100%; text-align: left;
  background: var(--accent); color: #fff;
  border-radius: 20px; padding: 22px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.create:active { transform: scale(.99); }
.create small { display: block; font-size: 13px; opacity: .85; margin-bottom: 6px; }
.create strong { font-size: 20px; font-weight: 700; line-height: 1.3; }
.create .plus { width: 52px; height: 52px; flex: none; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; }
.create .plus svg { width: 26px; height: 26px; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; }

/* 제안 카드 */
.suggest { background: var(--accent-soft); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.suggest p { margin: 0; font-size: 14px; line-height: 1.55; }
.suggest b { color: var(--accent); }
.suggest-actions { display: flex; gap: 8px; }
.btn { height: 38px; padding: 0 16px; border-radius: 10px; font-size: 13px; font-weight: 600; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--bg); color: var(--sub); }
.btn-line { background: var(--bg); color: var(--fg); border: 1px solid var(--line); }

/* 폴더 그리드 (홈) */
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; }
.section-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.section-head span { font-size: 13px; color: var(--sub); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.folder { text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.thumb { width: 100%; aspect-ratio: 1 / 1; border-radius: 14px; background: var(--ph); position: relative; overflow: hidden; }
.thumb::after { content: ""; position: absolute; left: 50%; top: 50%; width: 28px; height: 22px; transform: translate(-50%,-50%); border: 2px solid var(--ph-2); border-radius: 5px; }
.badge { position: absolute; top: 8px; left: 8px; z-index: 1; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #fff; background: var(--accent); padding: 4px 8px; border-radius: 999px; }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.f-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
.faces { display: flex; }
.faces span { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--bg); background: var(--ph-2); margin-left: -6px; font-size: 9px; font-weight: 600; display: grid; place-items: center; color: var(--fg); }
.faces span:first-child { margin-left: 0; }

/* 스크롤해도 상단 고정 */
.sticky { position: sticky; top: -20px; z-index: 3; background: var(--bg); margin: -20px -20px 0; padding: 20px 20px 12px; }
.sticky.top { padding-bottom: 10px; }
.sticky.scrolled { box-shadow: 0 1px 0 var(--line); }
.sticky { transition: transform .25s ease, box-shadow .2s; }
.sticky.hide { transform: translateY(-100%); box-shadow: none; }
.p-sticky { display: flex; flex-direction: column; gap: 14px; }

/* 전체 사진 */
.p-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.p-top h1 { margin: 0; font-size: 21px; font-weight: 700; }
.p-top .count { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; margin-top: 2px; }
.cal-btn { position: relative; width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--accent-soft); color: var(--fg); display: inline-flex; align-items: center; gap: 6px; }
.cal-btn .on { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--fg); border: 1.5px solid var(--accent-soft); }
.cal-btn[aria-expanded="true"] .on { border-color: var(--fg); background: #fff; }
.cal-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cal-btn[aria-expanded="true"] { background: var(--fg); color: #fff; }
.cal { background: var(--bg); border-radius: 18px; padding: 16px 12px 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.18); }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding-inline: 4px; }
.cal-head b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cal-nav { display: flex; gap: 4px; }
.cal-nav button { width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--fg); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-wd { font-size: 11px; color: var(--sub); padding-bottom: 4px; }
.cal-grid { row-gap: 4px; }
.cal-day { position: relative; width: 100%; max-width: 42px; aspect-ratio: 1 / 1; margin-inline: auto; border-radius: 10px; font-size: 13px; font-variant-numeric: tabular-nums; color: #B5B5B5; display: grid; place-items: center; }
.cal-day.has { color: #fff; font-weight: 700; background: #A9A9A9; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.cal-day.has span { position: relative; z-index: 1; }
.cal-day.today:not(.has) { color: var(--fg); font-weight: 700; }
.cal-day[aria-pressed="true"] { outline: 2.5px solid var(--fg); outline-offset: 2px; }
.cal-note { font-size: 12px; color: var(--sub); padding-inline: 4px; display: flex; align-items: center; gap: 6px; }
.cal-note i { width: 12px; height: 12px; border-radius: 3px; background: #A9A9A9; }
.cal-layer { position: absolute; inset: 0; z-index: 6; }
.cal-dim { position: absolute; inset: 0; background: rgba(0,0,0,.35); animation: fade .15s ease-out; }
.cal-pop { position: absolute; top: 76px; left: 12px; right: 12px; animation: drop .18s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
.day { scroll-margin-top: 12px; }
.day.hl .day-head { text-decoration: underline; text-underline-offset: 4px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: -4px -20px 0; padding: 4px 20px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid var(--line); color: var(--sub); background: var(--bg); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.day { display: flex; flex-direction: column; gap: 8px; }
.day-head { display: flex; align-items: baseline; gap: 6px; font-size: 14px; font-weight: 600; }
.day-head span { font-size: 12px; font-weight: 500; color: var(--sub); }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-inline: -20px; }
.ph { aspect-ratio: 1 / 1; background: var(--ph); position: relative; }
.ph:nth-child(3n+2) { background: #E8E8E8; }
.ph:nth-child(4n+1) { background: #DCDCDC; }
.stack { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 4px; padding: 5px 7px; font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 2px rgba(0,0,0,.7); }
.stack svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2; flex: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.75)); }
.stack b { font-weight: 700; font-variant-numeric: tabular-nums; }
.ph.in-group::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--fg); pointer-events: none; }
.ph.in-group:not(.lead)::before { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }
.best { position: absolute; top: 5px; left: 5px; font-size: 9px; font-weight: 700; letter-spacing: .04em; color: #fff; background: var(--accent); padding: 2px 5px; border-radius: 4px; }

.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.row:last-child { border-bottom: 0; }
.row-thumb { width: 60px; height: 60px; border-radius: 12px; background: var(--ph); flex: none; }
.row-face { width: 52px; height: 52px; border-radius: 50%; background: var(--ph-2); flex: none; display: grid; place-items: center; font-weight: 600; font-size: 16px; }
.row-pin { width: 52px; height: 52px; border-radius: 12px; background: var(--accent-soft); flex: none; display: grid; place-items: center; }
.row-pin svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
.row-body { flex: 1; min-width: 0; }
.row-body b { display: block; font-size: 15px; font-weight: 600; }
.row-body span { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
.row-arrow { color: var(--sub); font-size: 18px; }
.me { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 4px; margin-left: 4px; vertical-align: 2px; }


/* 로딩 */
.sk { background: var(--ph); border-radius: 10px; position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); transform: translateX(-100%); animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }

/* 빈 상태 / 오류 */
.center-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 24px 8px; }
.illust { width: 148px; height: 120px; border-radius: 20px; border: 2px dashed var(--ph-2); display: grid; place-items: center; color: var(--sub); font-size: 12px; margin-bottom: 8px; }
.center-state h3 { margin: 0; font-size: 18px; font-weight: 700; }
.center-state p { margin: 0 0 8px; font-size: 14px; color: var(--sub); line-height: 1.55; }
.center-state .btn { height: 46px; padding: 0 24px; font-size: 15px; border-radius: 12px; }
.err-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--danger-soft); display: grid; place-items: center; margin-bottom: 6px; }
.err-icon svg { width: 26px; height: 26px; stroke: var(--danger); stroke-width: 2; fill: none; stroke-linecap: round; }
.search-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; margin-bottom: 6px; }
.search-icon svg { width: 26px; height: 26px; stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; }

/* 하단 탭 */
.fab { position: absolute; right: 18px; bottom: 82px; z-index: 4; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
.fab svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; }
.fab:active { transform: scale(.96); }
.scroll { padding-bottom: 88px; }
.tabbar { border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; padding: 8px 6px 12px; background: var(--bg); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--sub); padding: 4px 0; }
.tab svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab-plus { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; margin-top: -18px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.tab-plus svg { stroke: #fff; stroke-width: 2.4; }

/* 토스트 (화면 이동 대신 피드백) */
.toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--fg); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 10px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.toast.show { opacity: 1; }

/* 공유 앨범 */
.phone.in-album .tabbar { display: none; }
.phone.in-album .fab { bottom: 20px; }
.phone.in-album.ai-bar .fab { bottom: 88px; }
.phone.in-album .toast { bottom: 92px; }
.phone.in-album.ai-bar .toast { bottom: 160px; }
.phone.ai-bar .scroll { padding-bottom: 170px; }
.a-sticky { padding-bottom: 8px; }
.a-sticky .sticky-dl { position: absolute; left: 0; right: 0; top: 100%; padding: 4px 20px 12px; background: var(--bg); box-shadow: 0 1px 0 var(--line); display: none; }
.a-sticky.past .sticky-dl { display: block; }
.a-sticky.past { box-shadow: none; }
.a-sticky.hide { transform: translateY(calc(-100% - 64px)); }
.a-sticky .sticky-dl .dl-btn { width: 100%; height: 42px; }
.a-cover { margin: -12px -20px 0; aspect-ratio: 16 / 10; background: #CFCFCF; position: relative; display: grid; place-items: center; }
.a-cover svg { width: 56px; height: 56px; stroke: rgba(255,255,255,.75); fill: none; stroke-width: 1.4; }
.a-cover .cover-tag { position: absolute; left: 12px; bottom: 12px; font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.a-body { display: flex; flex-direction: column; gap: 14px; }
.a-bar { display: flex; align-items: center; gap: 4px; margin-inline: -8px; }
.a-bar h1 { flex: 1; min-width: 0; margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-actions { display: flex; gap: 2px; }
.a-info { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.a-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.a-meta b { color: var(--fg); font-weight: 600; }
.live { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #fff; background: var(--accent); padding: 4px 8px; border-radius: 999px; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.6s ease-in-out infinite; }
.a-people { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
.faces.lg span { width: 26px; height: 26px; font-size: 11px; margin-left: -8px; }
.faces.lg span:first-child { margin-left: 0; }
.faces.lg span.more { background: var(--fg); color: #fff; font-size: 10px; }
.dl-btn { position: relative; overflow: hidden; height: 46px; border-radius: 12px; border: 1px solid var(--fg); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; font-variant-numeric: tabular-nums; }
.dl-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; position: relative; }
.dl-btn span { position: relative; }
.dl-btn .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent-soft); transition: width .12s linear; }
.dl-btn:disabled { cursor: default; border-color: var(--line); }
.a-tabs { display: grid; grid-template-columns: repeat(3, 1fr); margin-inline: -20px; border-bottom: 1px solid var(--line); }
.a-tab { height: 44px; font-size: 14px; color: var(--sub); position: relative; }
.a-tab[aria-selected="true"] { color: var(--fg); font-weight: 700; }
.a-tab[aria-selected="true"]::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: -1px; height: 2px; background: var(--fg); }
.a-tab:disabled { opacity: .5; cursor: default; }
.ph.member { -webkit-touch-callout: none; user-select: none; }
.hint { font-size: 12px; color: var(--sub); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
.ai-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
.ai-card { text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ai-card .ph { border-radius: 12px; overflow: hidden; }
.ai-card p { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.4; }
.ai-card small { font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; }
.ai-bar-el { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px 14px; }
.ai-bar-el button { width: 100%; height: 50px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet-layer { position: absolute; inset: 0; z-index: 9; }

/* 사진 상세 */
.viewer { position: absolute; inset: 0; z-index: 8; background: #0B0B0B; color: #fff; display: flex; flex-direction: column; animation: fade .18s ease-out; }
.viewer button { color: #fff; }
.phone.viewing .toast { bottom: auto; top: 76px; background: #fff; color: #111; }
.v-top { display: flex; align-items: center; gap: 6px; padding: 14px 10px 8px; transition: opacity .2s; }
.v-top .icon-btn svg { stroke: #fff; }
.v-meta { flex: 1; min-width: 0; }

<script>
/* ---------- 더미 데이터 ---------- */
const folders = [
  { name: "속초 여행",  date: "10.3 – 10.4", photos: 214, members: ["지","민","서"], extra: 2, live: true,  owner: true },
  { name: "동아리 MT",  date: "9.27",        photos: 186, members: ["성","은","하"], extra: 8, live: false, owner: false },
  { name: "롯데월드",   date: "9.14",        photos: 73,  members: ["유","나","준"], extra: 0, live: false, owner: true },
  { name: "전시회",     date: "8.30",        photos: 41,  members: ["윤","수","아"], extra: 1, live: false, owner: false },
];
const TOTAL = folders.reduce((s, f) => s + f.photos, 0);

// 날짜 묶음: count장, best = AI 추천 사진 위치, groups = { 추천 사진 위치: 비슷한 사진 묶음 장수 }
const days = [
  { iso: "2026-10-04", date: "10월 4일", folder: "속초 여행", count: 12, best: [0, 7], groups: { 0: 6, 7: 4 } },
  { iso: "2026-10-03", date: "10월 3일", folder: "속초 여행", count: 9,  best: [2],    groups: { 2: 5 } },
  { iso: "2026-09-27", date: "9월 27일", folder: "동아리 MT", count: 10, best: [1, 6], groups: { 1: 4, 6: 3 } },
  { iso: "2026-09-14", date: "9월 14일", folder: "롯데월드",  count: 6,  best: [3],    groups: { 3: 3 } },

const people = [
  { name: "승은", n: 128, me: true }, { name: "지민", n: 96 }, { name: "서연", n: 74 },
  { name: "하준", n: 61 }, { name: "유나", n: 38 },
];
const places = [
  { name: "속초 영금정", sub: "강원 속초시", n: 142 },
  { name: "대성리 MT촌", sub: "경기 가평군", n: 186 },
  { name: "롯데월드 어드벤처", sub: "서울 송파구", n: 73 },
];
const chipList = [
  ["all", "전체"], ["best", "AI 추천만"], ["folder", "폴더별"], ["people", "사람별"], ["place", "장소별"],
];

/* ---------- 앱 상태 ---------- */
let screenName = "home";
const states = { home: "default", photos: "default", album: "default", menu: "default", fset: "owner", create: "default", notif: "default", profile: "default", pedit: "default", share: "default", cluster: "default", review: "default" };
const stateLabels = {
  home:   [["default","기본"],["loading","로딩"],["empty","비어 있음"],["error","불러오기 실패"]],
  photos: [["default","기본"],["loading","로딩"],["empty","비어 있음"],["noresult","필터 결과 없음"],["error","불러오기 실패"]],
  album:  [["default","기본"],["loading","로딩"],["empty","비어 있음"],["nogroup","비슷한 묶음 없음"],["error","불러오기 실패"]],
  menu:   [["default","기본"],["limited","사진 권한 일부만 허용"]],
  fset:   [["owner","방장으로 보기"],["member","참여자로 보기"]],
  create: [["default","기본"],["fail","만들기 실패"]],

const screenTitles = { home: "홈", photos: "전체 사진", album: "공유 앨범", menu: "메뉴", fset: "폴더 설정", create: "폴더 만들기", notif: "알림", profile: "프로필", pedit: "프로필 수정", share: "링크·QR 공유", cluster: "AI 분류", review: "추천 확인" };
let suggestOpen = true;
let chip = "all";
let calOpen = false;
let calY = 2026, calM = 9;      // 0부터 시작하는 월 (9 = 10월)
let pickedDate = null;
const TODAY = "2026-10-10";

const screen = document.getElementById("screen");
const switcher = document.getElementById("switcher");

/* ---------- 홈 ---------- */
const header = () => `
  <header class="top sticky">
    <div class="brand" aria-label="서비스 이름 자리">서비스명</div>
    <div class="top-icons">

        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>

const createBtn = `

function folderCard(f, i) {

      </div>

}

const errorBlock = `

    <div class="err-icon"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg></div>
    <h3>사진을 불러오지 못했어요</h3>
    <p>인터넷 연결을 확인한 뒤<br>다시 시도해 주세요.</p>
    <button class="btn btn-primary" type="button" data-retry>다시 시도</button>
  </div>`;

const homeViews = {
  default: () => `

    ${createBtn}
    ${suggestOpen ? `
    <section class="suggest" aria-label="공유 폴더 제안">

      <div class="suggest-actions">

        <button class="btn btn-ghost" type="button" data-close>닫기</button>
      </div>

    <section class="section">
      <div class="section-head"><h2>내 폴더</h2><span>${folders.length}개</span></div>
      <div class="grid">${folders.map(folderCard).join("")}</div>
    </section>`,

  loading: () => `
    ${header()}
    ${createBtn}
    <section class="section" aria-busy="true" aria-label="폴더 불러오는 중">
      <div class="section-head"><h2>내 폴더</h2><span>불러오는 중…</span></div>
      <div class="grid">
        ${Array.from({length: 4}).map(() => `
          <div style="display:flex;flex-direction:column;gap:8px">
            <div class="sk" style="aspect-ratio:1/1;border-radius:14px"></div>
            <div class="sk" style="height:14px;width:70%"></div>
            <div class="sk" style="height:12px;width:50%"></div>
          </div>`).join("")}
      </div>
    </section>`,

  empty: () => `
    ${header()}
    <div class="center-state">
      <div class="illust">일러스트 자리</div>
      <h3>친구와 사진을 공유해 보세요</h3>
      <p>공유 폴더를 만들고 링크를 보내면<br>모두의 사진이 한곳에 모여요.</p>
      <button class="btn btn-primary" type="button" data-create>공유 폴더 만들기</button>
    </div>`,

  error: () => `${header()}${errorBlock}`,
};

/* ---------- 전체 사진 ---------- */
function photosHeader(countText) {
  if (selecting) return `<header class="a-bar sel-top">${selTop()}</header>`;
  return `
    <header class="p-top">
      <div>
        <h1>전체 사진</h1>
        <div class="count">${countText}</div>
      </div>
      <div class="p-actions">
        <button class="cal-btn" type="button" data-cal aria-expanded="${calOpen}" aria-label="${pickedDate ? `날짜로 찾기, ${labelOf(pickedDate)} 선택됨` : "날짜로 찾기"}">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>${pickedDate ? '<span class="on"></span>' : ""}
        </button>
        <button class="icon-btn" type="button" data-opts="photos" aria-label="옵션">${svg.more}</button>
      </div>
    </header>`;
}

function chipsBar(disabled) {
  return `
    <div class="chips" role="group" aria-label="사진 필터">
      ${chipList.map(([k, label]) => `<button class="chip" type="button" data-chip="${k}" aria-pressed="${chip === k}" ${disabled ? "disabled" : ""}>${label}</button>`).join("")}
    </div>`;
}

const expanded = new Set();   // 펼친 묶음 id

const stackIcon = '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>';

/* 선택 모드 · 비슷한 사진 삭제 */
let selecting = false;
const selected = new Set();
const deleted = new Set();          // 휴지통으로 옮긴 사진 id
let trashCount = 12;
const isMine = (di, idx) => (di + idx) % 2 === 1;   // 더미: 내가 올린 사진
const ownedByMe = id => {
  if (id.startsWith("m")) return true;                 // 내 사진 탭
  const [di, idx] = id.slice(1).split("-").map(Number);
  return isMine(di, idx);
};
const checkMark = '<span class="check"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>';
const selAttr = id => selecting ? `aria-pressed="${selected.has(id)}"` : "";
const leftKs = (prefix, di, i, size) => [...Array(size).keys()].filter(k => !deleted.has(`${prefix}${di}-${i + k}`));
const deletedIn = (prefix, di) => [...deleted].filter(id => id.startsWith(`${prefix}${di}-`)).length;

function dedupeCandidates(prefix) {
  const list = prefix === "p" ? days : albumDays;
  const mine = [], others = [];
  list.forEach((d, di) => Object.entries(d.groups).forEach(([i0, size]) => {
    const i = Number(i0), gid = `${prefix}${di}-${i}`;
    const ks = leftKs(prefix, di, i, size);
    const pick = ks.includes(bestPick[gid] || 0) ? (bestPick[gid] || 0) : ks[0];
    for (let k = 0; k < size; k++) {
      const id = `${prefix}${di}-${i + k}`;
      if (k === pick || deleted.has(id)) continue;
      (isMine(di, i + k) ? mine : others).push(id);
    }
  }));
  return { mine, others };
}

function photoTile(id, opts = {}) {
  const { size = 0, open = false, isBest = false, member = false, gid = "", solo = false } = opts;
  if (solo) return `
    <button class="ph" type="button" data-photo="${id}" ${selAttr(id)} aria-label="사진 (AI 추천)">
      <span class="best">BEST</span>${selecting ? checkMark : ""}
    </button>`;
  const cls = ["ph", open ? "in-group" : "", open && isBest ? "lead" : "", member ? "member" : ""].join(" ");
  const attrs = [
    isBest ? `data-group="${gid}" aria-expanded="${open}"` : "",
    member ? `data-member="${id}" data-grp="${gid}"` : "",
  ].join(" ");
  return `
    <button class="${cls}" type="button" data-photo="${id}" ${attrs} ${selAttr(id)} aria-label="사진${isBest ? ` (AI 추천, 비슷한 사진 ${size}장 묶음)` : ""}">
      ${isBest ? '<span class="best">BEST</span>' : ""}
      ${isBest ? `<span class="stack">${stackIcon}<b>${size}장</b></span>` : ""}
      ${selecting ? checkMark : ""}
    </button>`;
}

function dayGroups(onlyBest) {
  return days.map((d, di) => {
    const tiles = [];
    for (let i = 0; i < d.count; i++) {
      const size = d.groups[i];
      const gid = `p${di}-${i}`;
      if (size) {
        const ks = leftKs("p", di, i, size);
        const open = expanded.has(gid) && !selecting;
        const pick = ks.includes(bestPick[gid] || 0) ? (bestPick[gid] || 0) : ks[0];
        if (!ks.length) {
          // 묶음 전체를 지운 경우
        } else if (ks.length === 1) {
          tiles.push(photoTile(`p${di}-${i + ks[0]}`, { solo: true }));
        } else if (open) {
          for (const k of ks) {
            const isBest = k === pick;
            tiles.push(photoTile(`p${di}-${i + k}`, { size: ks.length, open, isBest, member: !isBest, gid }));
          }
        } else {
          tiles.push(photoTile(`p${di}-${i + pick}`, { size: ks.length, isBest: true, gid }));
        }
        i += size - 1;
      } else if (!onlyBest && !deleted.has(gid)) {
        tiles.push(photoTile(gid));
      }
    }
    if (!tiles.length) return "";
    const shown = onlyBest ? `추천 ${Object.keys(d.groups).length}장` : `${d.count - deletedIn("p", di)}장`;
    return `
      <section class="day${pickedDate === d.iso ? " hl" : ""}" id="day-${d.iso}">
        <div class="day-head">${d.date}<span>· ${d.folder} · ${shown}</span></div>
        <div class="pgrid">${tiles.join("")}</div>
      </section>`;
  }).join("");
}

function chipBody() {
  if (chip === "all")  return dayGroups(false);
  if (chip === "best") return dayGroups(true);
  if (chip === "folder") return `<div class="list">${folders.map((f, i) => `
    <button class="row" type="button" data-album="${i}">
      <span class="row-thumb"></span>
      <span class="row-body"><b>${f.name}</b><span>${f.date} · ${f.photos}장</span></span>
      <span class="row-arrow">›</span>
    </button>`).join("")}</div>`;
  if (chip === "people") return `<div class="list">${people.map(p => `
    <button class="row" type="button" data-cgrid="photos|people|${p.name}">
      <span class="row-face">${p.name[0]}</span>
      <span class="row-body"><b>${p.name}${p.me ? '<span class="me">나</span>' : ""}</b><span>사진 ${p.n}장</span></span>
      <span class="row-arrow">›</span>
    </button>`).join("")}</div>`;
  if (chip === "place") return `<div class="list">${places.map(p => `
    <button class="row" type="button" data-cgrid="photos|places|${p.name}">
      <span class="row-pin"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
      <span class="row-body"><b>${p.name}</b><span>${p.sub} · ${p.n}장</span></span>
      <span class="row-arrow">›</span>
    </button>`).join("")}</div>`;
}

const pad = n => String(n).padStart(2, "0");
function labelOf(iso) { const [, m, d] = iso.split("-").map(Number); return `${m}월 ${d}일`; }

function calendar() {
  const has = new Set(days.map(d => d.iso));
  const first = new Date(calY, calM, 1).getDay();
  const last = new Date(calY, calM + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push("<span></span>");
  for (let d = 1; d <= last; d++) {
    const iso = `${calY}-${pad(calM + 1)}-${pad(d)}`;
    const cls = ["cal-day", has.has(iso) ? "has" : "", iso === TODAY ? "today" : ""].join(" ");
    cells.push(`<button class="${cls}" type="button" data-day="${iso}" aria-pressed="${pickedDate === iso}" aria-label="${calM + 1}월 ${d}일${has.has(iso) ? ", 사진 있음" : ""}"><span>${d}</span></button>`);
  }
  return `
    <section class="cal" aria-label="날짜로 사진 찾기">
      <div class="cal-head">
        <b>${calY}년 ${calM + 1}월</b>
        <div class="cal-nav">
          <button type="button" data-month="-1" aria-label="이전 달">‹</button>
          <button type="button" data-month="1" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="cal-grid">
        ${["일","월","화","수","목","금","토"].map(w => `<span class="cal-wd">${w}</span>`).join("")}
        ${cells.join("")}
      </div>
      <div class="cal-note"><i></i>사진이 있는 날에는 그날 찍은 사진이 보여요</div>
    </section>`;
}

const photoViews = {
  default: () => selecting
    ? `<div class="sticky p-sticky">${photosHeader()}${chipsBar(false)}</div>${chipBody()}`
    : `<div class="sticky p-sticky">${photosHeader(`${TOTAL}장 · 폴더 ${folders.length}개`)}${chipsBar(false)}</div>${chipBody()}`,

  loading: () => `
    <div class="sticky p-sticky">${photosHeader("불러오는 중…")}${chipsBar(true)}</div>
    <section class="day" aria-busy="true" aria-label="사진 불러오는 중">
      <div class="sk" style="height:14px;width:40%"></div>
      <div class="pgrid">${Array.from({length: 12}).map(() => '<div class="sk" style="aspect-ratio:1/1;border-radius:0"></div>').join("")}</div>
    </section>`,

  empty: () => `
    <div class="sticky p-sticky">${photosHeader("0장")}</div>
    <div class="center-state">
      <div class="illust">일러스트 자리</div>
      <h3>아직 공유받은 사진이 없어요</h3>
      <p>공유 폴더를 만들거나 친구의 링크로 참여하면<br>사진이 여기에 모여요.</p>
      <button class="btn btn-primary" type="button" data-create>공유 폴더 만들기</button>
    </div>`,

  noresult: () => `
    <div class="sticky p-sticky">${photosHeader(`${TOTAL}장 · 폴더 ${folders.length}개`)}${chipsBar(false)}</div>
    <div class="center-state">
      <div class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>
      <h3>이 조건에 맞는 사진이 없어요</h3>
      <p>다른 필터를 고르거나<br>필터를 초기화해 보세요.</p>
      <button class="btn btn-line" type="button" data-reset>필터 초기화</button>
    </div>`,

  error: () => `<div class="sticky p-sticky">${photosHeader("")}${chipsBar(true)}</div>${errorBlock}`,
};

/* ---------- 공유 앨범 ---------- */
let albumIdx = 0;
let albumTab = "all";            // all | best | mine
let openGroup = null;            // 펼친 묶음 id (한 번에 하나)
const bestPick = {};             // 묶음 id → BEST로 지정한 컷 위치(0 = 원래 추천)
let dl = { running: false, n: 0, timer: null };

const albumMembers = ["지", "민", "서", "하"];   // + 2명 = 6명

  { head: "10월 4일 오전", count: 8,  groups: { 2: 4 },       reasons: { 2: "표정이 가장 자연스러워요" } },
  { head: "10월 3일 저녁", count: 9,  groups: { 0: 5, 6: 3 }, reasons: { 0: "흔들림이 없어요", 6: "모두 화면 안에 들어왔어요" } },

function dlLabel(total) {
  return dl.running
    ? `<span class="fill" style="width:${Math.round(dl.n / total * 100)}%"></span><span>저장 중 ${dl.n}/${total}</span>`
    : `${svg.down}<span>전체 다운로드 · ${total}장</span>`;
}

        <div class="a-people">
          <span class="faces lg">${f.isNew ? "<span>승</span>" : `${albumMembers.map(m => `<span>${m}</span>`).join("")}<span class="more">+2</span>`}</span>

function aTile(id, o = {}) {
  const { best = false, size = 0, group = "", member = false, inGroup = false, lead = false, solo = false } = o;
  if (solo) return `
    <button class="ph" type="button" data-photo="${id}" ${selAttr(id)} aria-label="사진 (AI 추천)">
      <span class="best">BEST</span>${selecting ? checkMark : ""}
    </button>`;
  const cls = ["ph", inGroup ? "in-group" : "", lead ? "lead" : "", member ? "member" : ""].join(" ");
  const attrs = [
    `data-photo="${id}"`,
    group && !member ? `data-agroup="${group}"` : "",
    member ? `data-member="${id}" data-grp="${group}"` : "",
  ].join(" ");
  return `
    <button class="${cls}" type="button" ${attrs} ${selAttr(id)} aria-label="사진${best ? ` (AI 추천, 비슷한 사진 ${size}장 묶음)` : ""}">
      ${best ? '<span class="best">BEST</span>' : ""}
      ${best ? `<span class="stack">${stackIcon}<b>${size}장</b></span>` : ""}
      ${selecting ? checkMark : ""}
    </button>`;
}

function albumAll(grouped) {
  return albumDays.map((d, di) => {
    const tiles = [];
    for (let i = 0; i < d.count; i++) {
      const size = grouped ? d.groups[i] : 0;
      if (!size) { if (!deleted.has(`a${di}-${i}`)) tiles.push(aTile(`a${di}-${i}`)); continue; }
      const gid = `a${di}-${i}`;
      const ks = leftKs("a", di, i, size);
      const pick = ks.includes(bestPick[gid] || 0) ? (bestPick[gid] || 0) : ks[0];
      if (!ks.length) {
        // 묶음 전체를 지운 경우
      } else if (ks.length === 1) {
        tiles.push(aTile(`a${di}-${i + ks[0]}`, { solo: true }));
      } else if (openGroup === gid && !selecting) {
        for (const k of ks) {
          const isBest = k === pick;
          tiles.push(aTile(`a${di}-${i + k}`, { best: isBest, size: ks.length, group: gid, inGroup: true, lead: isBest, member: !isBest }));
        }
      } else {
        tiles.push(aTile(`a${di}-${i + pick}`, { best: true, size: ks.length, group: gid }));
      }
      i += size - 1;
    }
    return `
      <section class="day">
        <div class="day-head">${d.head}<span>· ${d.count - deletedIn("a", di)}장</span></div>
        <div class="pgrid">${tiles.join("")}</div>
      </section>`;
  }).join("");
}

function albumBest() {
  const cards = [];
  albumDays.forEach((d, di) => Object.keys(d.groups).forEach(k => {
    const ks = leftKs("a", di, Number(k), d.groups[k]);
    const size = ks.length;
    if (!size) return;
    const gid = `a${di}-${k}`;
    const pick = ks.includes(bestPick[gid] || 0) ? (bestPick[gid] || 0) : ks[0];
    cards.push(`
      <button class="ai-card" type="button" data-view="a${di}-${Number(k) + pick}">
        <span class="ph" style="display:block">
          <span class="best">BEST</span>
          ${size > 1 ? `<span class="stack">${stackIcon}<b>${size}장</b></span>` : ""}
        </span>
        <p>${d.reasons[k]}</p>
        <small>${d.head} · ${size > 1 ? `${size}장 중 1장` : "비슷한 사진 정리됨"}</small>
      </button>`);
  }));
  return `
    ${myFaceBlock()}
    <div class="section-head"><h2>AI가 고른 베스트샷</h2><span>${cards.length}장</span></div>
    <div class="ai-grid">${cards.join("")}</div>`;
}

/* AI 추천 탭: 내 얼굴이 나온 사진 묶음 (메뉴의 얼굴 인식 설정을 따른다) */

function albumMine() {
  return albumDays.map((d, di) => {
    const idx = Array.from({ length: d.count }, (_, i) => i).filter(i => i % 3 === 1 && !deleted.has(`m${di}-${i}`));
    return `
      <section class="day">
        <div class="day-head">${d.head}<span>· 내가 찍은 ${idx.length}장</span></div>
        <div class="pgrid">${idx.map(i => aTile(`m${di}-${i}`)).join("")}</div>
      </section>`;
  }).join("");
}

function albumBody(grouped) {

    if (!grouped) return `

      </div>`;
    return albumBest();

}

/* 앱을 열면: 수집 중인 폴더에 오늘 새로 찍은 사진 올리기 */
const NEW_SHOTS = 18;            // 더미: 마지막 업로드 후 새로 찍은 사진 수
let autoUp = null;               // { idx, items: [{ p, state }], done, timer }

function showLaunchUpload() {
  if (screenName !== "home" || states.home !== "default" || viewer) return;
  const idx = folders.findIndex(f => f.live);
  if (idx < 0) return;
  openSheet(`
    <h3>'${folders[idx].name}'에 오늘 찍은 사진을 업로드할까요?</h3>
    <p class="up-ask-sub">마지막 업로드 후 ${NEW_SHOTS}장을 더 찍었어요.</p>
    <div class="sheet-actions">
      <button class="btn btn-soft" type="button" data-sheetclose>닫기</button>
      <button class="btn btn-primary" type="button" data-autoup="${idx}">업로드</button>
    </div>`);
}

function startAutoUpload(idx) {
  clearInterval(autoUp && autoUp.timer);
  autoUp = { idx, items: Array.from({ length: NEW_SHOTS }, (_, i) => ({ p: 0, state: i < 3 ? "up" : "wait" })), done: false, timer: null };
  autoUp.timer = setInterval(() => {
    const it = autoUp.items;
    const running = it.filter(x => x.state === "up").length;
    it.filter(x => x.state === "wait").slice(0, Math.max(0, 3 - running)).forEach(x => x.state = "up");
    it.forEach((x, i) => {
      if (x.state !== "up") return;
      x.p = Math.min(100, x.p + 9 + (i * 7) % 14);
      if (x.p >= 100) x.state = "done";
    });
    if (it.every(x => x.state === "done")) {
      clearInterval(autoUp.timer);
      autoUp.done = true;
      folders[autoUp.idx].photos += NEW_SHOTS;
      if (screenName === "album" && albumIdx === autoUp.idx) render(true);
      toast(`${NEW_SHOTS}장을 '${folders[autoUp.idx].name}'에 올렸어요`);
      return;
    }
    const el = document.getElementById("upBlock");
    if (el) el.outerHTML = uploadBlock();
  }, 180);
}

const upPct = () => Math.round(autoUp.items.reduce((a, x) => a + (x.state === "done" ? 100 : x.state === "up" ? x.p : 0), 0) / autoUp.items.length);

function uploadBlock() {
  if (!autoUp || autoUp.idx !== albumIdx || albumTab === "best") return "";
  const it = autoUp.items, n = it.filter(x => x.state === "done").length;
  if (autoUp.done) return `
    <section class="day" id="upBlock">
      <div class="day-head">방금 올린 내 사진<span>· ${it.length}장</span></div>
      <div class="pgrid">${it.map((_, i) => `<button class="ph" type="button" data-photo="m0-${100 + i}" aria-label="방금 올린 사진"></button>`).join("")}</div>
    </section>`;
  const pct = upPct();
  return `
    <section class="up-live" id="upBlock" aria-live="polite">
      <div class="up-live-top"><b>내 사진 올리는 중 · ${n}/${it.length}장</b><span>${pct}%</span></div>
      <div class="up-live-track"><i style="width:${pct}%"></i></div>
      <div class="pgrid up-live-grid">
        ${it.map(x => `<div class="ph up-tile ${x.state}">
          ${x.state === "wait" ? "<em>대기</em>" : x.state === "up" ? `<em>${Math.round(x.p)}%</em><span class="bar"><i style="width:${x.p}%"></i></span>` : `<span class="ok"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>`}
        </div>`).join("")}
      </div>
    </section>`;
}

/* 바텀 시트 */
let sheetTimer = null;
function openSheet(html) {
  clearTimeout(sheetTimer);
  const layer = document.getElementById("sheet"), body = document.getElementById("sheetBody");
  body.innerHTML = html;
  body.style.transform = "";
  body.scrollTop = 0;
  layer.classList.remove("closing");
  layer.hidden = false;
  body.style.touchAction = body.scrollHeight > body.clientHeight + 1 ? "pan-y" : "none";
  if (typeof ensureGuard === "function") ensureGuard();
}
function closeSheet() {
  const layer = document.getElementById("sheet");
  if (layer.hidden || layer.classList.contains("closing")) return;
  layer.classList.add("closing");
  clearTimeout(sheetTimer);
  sheetTimer = setTimeout(() => {
    layer.hidden = true;
    layer.classList.remove("closing");
    document.getElementById("sheetBody").style.transform = "";
  }, 200);
}

function startDl() {
  const total = folders[albumIdx].photos;
  dl = { running: true, n: 0, timer: null };
  const step = Math.max(1, Math.round(total / 40));
  dl.timer = setInterval(() => {
    dl.n = Math.min(total, dl.n + step);
    const btns = screen.querySelectorAll(".dl-btn");
    btns.forEach(b => { b.disabled = true; b.innerHTML = dlLabel(total); });
    if (dl.n >= total) {
      stopDl();
      btns.forEach(b => { b.disabled = false; b.innerHTML = dlLabel(total); });

let pressTimer = null, longPressed = false;
document.addEventListener("pointerdown", e => {
  if (selecting || !(screenName === "photos" || screenName === "album")) return;
  const t = e.target.closest("[data-member]");
  const ph = e.target.closest("[data-photo]");
  if (!t && ph) {
    // 일반 사진을 꾹 누르면 선택 모드로 들어가고 그 사진을 고른다
    longPressed = false;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      longPressed = true;
      selecting = true; selected.clear(); selected.add(ph.dataset.photo);
      expanded.clear(); openGroup = null;
      if (screenName === "photos" && chip !== "all" && chip !== "best") chip = "all";
      render(true);
      if (navigator.vibrate) navigator.vibrate(15);
    }, 500);
    return;
  }
  if (!t) return;
  longPressed = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    longPressed = true;
    const [di, i] = t.dataset.member.slice(1).split("-").map(Number);
    const [, gi] = t.dataset.grp.slice(1).split("-").map(Number);
    openSheet(`
      <h3>이 컷을 BEST로 지정할까요?</h3>

        <button class="btn btn-primary" type="button" data-setbest="${t.dataset.grp}:${i - gi}">BEST로 지정</button>
      </div>`);
  }, 500);
});

function qrSvg(seed) {
  let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const n = 21, cells = [];
  const finder = (x, y) => [[x, y], [x + 14, y], [x, y + 14]].some(([fx, fy]) => false);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (a, b) => x >= a && x < a + 7 && y >= b && y < b + 7;
    const f = inF(0, 0) || inF(14, 0) || inF(0, 14);
    if (f) {
      const lx = x < 7 ? x : x - 14, ly = y < 7 ? y : y - 14;
      const ring = lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4);
      if (ring) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
      continue;
    }
    h = (h * 1103515245 + 12345) >>> 0;
    if ((h >>> 16) % 2) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
  }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" fill="#111" aria-hidden="true">${cells.join("")}</svg>`;
}

function allIds(scope) {
  const list = scope === "photos" ? days : albumDays, pre = scope === "photos" ? "p" : "a";
  const ids = [];
  list.forEach((d, di) => { for (let i = 0; i < d.count; i++) if (!deleted.has(`${pre}${di}-${i}`)) ids.push(`${pre}${di}-${i}`); });
  return ids;
}
function hashPick(ids, seed, ratio) {
  let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return ids.filter((id, j) => ((h + j * 2654435761) >>> 0) % 100 < ratio * 100);
}
const meSplit = [
  { name: "나 혼자 나온 사진", key: "solo", n: 18 },
  { name: "함께 나온 사진", key: "with", n: 46 },
];
function clusterIds(scope, type, key) {
  const ids = allIds(scope);
  if (type === "me") {
    const item = meSplit.find(x => x.name === key);
    const picked = hashPick(ids, `me-${item.key}`, item.key === "solo" ? .22 : .5);
    return picked.length ? picked : ids.slice(0, 3);
  }
  if (type === "times") {
    const t = albumTimes.find(x => x.name === key);
    return ids.filter(id => parseId(id).di === t.di);
  }
  const src = type === "people" ? (scope === "photos" ? people : albumPeople) : (scope === "photos" ? places : albumPlaces);
  const item = src.find(x => x.name === key);
  const ratio = Math.min(.8, Math.max(.25, item.n / (scope === "photos" ? 160 : 90)));
  const picked = hashPick(ids, key, ratio);
  return picked.length ? picked : ids.slice(0, 3);
}

// 상세 그리드를 날짜별로 묶는다 (전체 사진: 날짜 + 폴더, 공유 앨범: 날짜 + 시간대)
function clusterByDate(ids, scope) {
  const groups = [];
  ids.forEach(id => {
    const { di } = parseId(id);
    let g = groups.find(x => x.di === di);
    if (!g) {
      if (scope === "photos") g = { di, date: days[di].date, sub: days[di].folder, ids: [] };
      else {
        const m = albumDays[di].head.match(/^(.*?일)\s*(.*)$/);
        g = { di, date: m ? m[1] : albumDays[di].head, sub: m ? m[2] : "", ids: [] };
      }
      groups.push(g);
    }
    g.ids.push(id);
  });
  return groups;
}

function rvDecide(keep) {

  if (card) {
